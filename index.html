<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Para Ludmi</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="scene">
    <canvas id="clavel" aria-label="Clavel formado por las letras Ludmi"></canvas>

    <div class="hint" id="hint">
      <span class="hint-arrow" aria-hidden="true">↑</span>
      <span class="hint-text">(scrollea hacia arriba para que aparezca la flor)</span>
    </div>

    <p id="error" class="error" hidden></p>
  </main>
</body>
</html>
